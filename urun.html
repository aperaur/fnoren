<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fnoren ürün detayı — 304 paslanmaz çelik.">
  <title>Ürün — Fnoren</title>
  <link rel="icon" href="assets/img/brand/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-icon"><img src="assets/img/brand/logo.png" alt="Fn."></a>
  <a href="index.html" class="nav-brand">Fnoren</a>
  <ul class="nav-links">
    <li><a href="urunler.html">Ürünler</a></li>
    <li><a href="hakkimizda.html">Hakkımızda</a></li>
    <li><a href="iletisim.html">İletişim</a></li>
  </ul>
</nav>

<section class="section" style="padding-top:calc(var(--nav-h) + 3rem)">
  <div class="container">
    <a href="urunler.html" class="label" style="display:inline-flex;align-items:center;gap:0.5rem;margin-bottom:2rem">← Tüm Ürünler</a>
    <div class="product-detail" id="product-detail">
      <div class="product-img-col">
        <p style="color:var(--muted)">Yükleniyor...</p>
      </div>
      <div class="product-info-col"></div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <span>© 2026 Fnoren</span>
    <div class="footer-links">
      <a href="urunler.html">Ürünler</a>
      <a href="hakkimizda.html">Hakkımızda</a>
      <a href="iletisim.html">İletişim</a>
    </div>
    <span class="mono" style="font-size:0.625rem">Bursa, TR — 304 Paslanmaz Çelik</span>
  </div>
</footer>

<script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const params = new URLSearchParams(window.location.search);
  const kod = params.get("kod");
  if (!kod) { window.location.href = "urunler.html"; return; }

  const SHOPIER_BASE = "https://www.shopier.com/ShowProduct/api/?s=";
  const HB_STORE     = "https://www.hepsiburada.com/magaza/fnoren";
  const katMap = { K: "Mutfak", B: "Banyo", E: "Giriş", A: "Aksesuar" };

  let veri;
  try {
    const resp = await fetch("data/urunler.json");
    veri = await resp.json();
  } catch (e) {
    document.getElementById("product-detail").innerHTML = '<p style="padding:3rem;color:var(--muted)">Ürün yüklenemedi.</p>';
    return;
  }

  const urun = (veri.urunler || []).find(u => u.base_kod === kod);
  if (!urun || urun.durum !== "aktif") { window.location.href = "urunler.html"; return; }

  const ad        = urun.ad_tr || urun.ad || "Ürün";
  const seri      = urun.seri || urun.ad || "";
  const pl        = urun.platform_links || {};
  const shopUrl   = pl.shopier ? `${SHOPIER_BASE}${pl.shopier}` : null;
  const hbUrl     = pl.hepsiburada || null;
  const olcu      = urun.olculer_cm;
  const kat       = katMap[urun.kategori] || urun.kategori;
  const kisa      = urun.aciklama_tr || "";
  const uzun      = urun.aciklama_uzun || "";
  // Uzun açıklamayı paragraflara böl (line breaks)
  const uzunHtml  = uzun
    ? uzun.split(/\n\s*\n|\n/).filter(s => s.trim()).map(s => `<p>${s.trim()}</p>`).join("")
    : "";

  document.title = `${ad} — Fnoren`;

  document.getElementById("product-detail").innerHTML = `
    <div class="product-img-col fade-in">
      <img src="assets/img/products/${kod}.jpg?v=nj329" alt="${ad}">
    </div>
    <div class="product-info-col fade-in">
      <span class="label mono" style="margin-bottom:0.5rem">${seri} — ${kat}</span>
      <h1>${ad}</h1>
      ${kisa ? `<p style="margin:1rem 0 0;color:var(--muted);line-height:1.6;font-size:0.9375rem">${kisa}</p>` : ''}
      <div class="stok-badge stok-badge--ok" style="margin:1.5rem 0">
        <span class="stok-dot stok-ok"></span>
        Satışta
      </div>

      <table class="spec-table" style="margin-bottom:2rem">
        <tr><td>Malzeme</td><td>304 Paslanmaz Çelik (AISI 304)</td></tr>
        <tr><td>Yüzey</td><td>Fırçalanmış Mat / HL</td></tr>
        ${olcu && olcu.en ? `<tr><td>Ölçü</td><td>${olcu.en} × ${olcu.boy}${olcu.yukseklik ? ' × ' + olcu.yukseklik : ''} cm</td></tr>` : ''}
        ${urun.agirlik_gram ? `<tr><td>Ağırlık</td><td>${urun.agirlik_gram}g</td></tr>` : ''}
        <tr><td>Kategori</td><td>${kat}</td></tr>
        <tr><td>Üretim</td><td>Bursa, TR</td></tr>
      </table>

      <div class="product-buttons">
        ${hbUrl ? `<a href="${hbUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-hb">Hepsiburada'da Satın Al →</a>` : ''}
        ${shopUrl ? `<a href="${shopUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-shopier">Shopier'da Satın Al →</a>` : ''}
      </div>

      ${uzunHtml ? `<section class="product-long-desc" style="margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border)"><span class="label mono" style="display:block;margin-bottom:1rem">Ürün Detayı</span><div style="line-height:1.7;color:var(--muted)">${uzunHtml}</div></section>` : ''}
    </div>
  `;

  // Trigger fade-in
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visible"); obs.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll(".fade-in").forEach(el => obs.observe(el));
});
</script>
</body>
</html>
